<style>
.great-vibes-regular {
  font-family: "Great Vibes", cursive;
  font-weight: 400;
  font-style: normal;
}

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html, body { overflow-x:hidden; }
body {
  min-height:100dvh;
  background:#7a9178;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:80px 20px;
  font-family:'Cormorant Garamond', Georgia, serif;
}

.outer {
  position:relative;
  width:min(440px, 100%);
}

.card {
  position:relative;
  background:#607562;
  border-radius:6px;
  /* taller: more top/bottom padding */
  padding:80px 44px 72px;
  animation:rise 1.1s cubic-bezier(.22,.8,.36,1) both;
}
@keyframes rise {
  from { opacity:0; transform:translateY(28px) scale(.97); }
  to   { opacity:1; transform:translateY(0) scale(1); }
}

.frame {
  position:absolute;
  inset:20px;
  border:1px solid rgba(255,255,255,.44);
  border-radius:2px;
  pointer-events:none;
  z-index:30;
}
.frame::before, .frame::after {
  content:'';
  position:absolute;
  width:10px; height:10px;
  border-color:rgba(255,255,255,.58);
  border-style:solid;
}
.frame::before { top:-1px; right:-1px; border-width:1px 1px 0 0; }
.frame::after  { bottom:-1px; left:-1px; border-width:0 0 1px 1px; }

.sparkles {
  position:absolute;
  width:62%;
  top:-38px;
  left:-24px;
  z-index:35;
  mix-blend-mode:screen;
  pointer-events:none;
  opacity:.55;
  animation:rise 1.3s cubic-bezier(.22,.8,.36,1) .04s both;
}
.flowers-top {
  position:absolute;
  width:66%;
  top:-50px;
  left:-36px;
  z-index:50;
  mix-blend-mode:screen;
  pointer-events:none;
  animation:rise 1.3s cubic-bezier(.22,.8,.36,1) .08s both;
}

.body {
  position:relative;
  z-index:25;
  text-align:center;
  color:#fff;
}

.name {
  font-size:clamp(86px, 21vw, 108px);
  text-shadow:0 2px 18px rgba(0,0,0,.12);
  margin-bottom:14px;
  animation:rise 1.1s ease .18s both;
}
.age {
  font-family:'Cinzel', serif;
  font-size: x-large;
  letter-spacing:8px;
  color:rgba(255,255,255,.86);
  margin-bottom:6px;
  font-weight: bold;
  animation:rise 1.1s ease .23s both;
}
.tagline {
  font-size:clamp(16px, 3.8vw, 19px);
  font-weight:600;
  letter-spacing:1.5px;
  color:rgba(255,255,255,.78);
  margin-bottom:32px;
  animation:rise 1.1s ease .27s both;
}

.div-line {
  display:flex; align-items:center; justify-content:center;
  gap:8px; margin:0 auto 30px; width:140px;
  animation:rise 1.1s ease .31s both;
}
.div-line::before, .div-line::after {
  content:''; flex:1; height:1px; background:rgba(255,255,255,.3);
}
.gem { width:5px; height:5px; background:rgba(255,255,255,.45); transform:rotate(45deg); flex-shrink:0; }

.details {
  display:flex; flex-direction:column; gap:22px;
  animation:rise 1.1s ease .36s both;
}
.row {
  display:flex; align-items:center; justify-content:center;
  gap:14px; text-align:left;
}
.row.vtop { align-items:flex-start; }
.ico { flex-shrink:0; width:26px; height:26px; opacity:.8; }
.row-text {
  font-size:x-large;
  line-height:1.5;
  font-weight: bold;
  color:rgba(255,255,255,.92);
}
.row-text small {
  display:block;
  font-size:.88em;
  opacity:.78;
}

.date-block {
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
}
.date-txt {
  font-family:'Cinzel', serif;
  font-size:clamp(22px, 5.5vw, 28px);
  letter-spacing:8px;
  color:#fff;
}
.date-day {
  font-family:'Cinzel', serif;
  font-size:clamp(11px, 2.6vw, 13px);
  letter-spacing:6px;
  color:rgba(255,255,255,.7);
  text-align:center;
}

.sep { width:30px; height:1px; background:rgba(255,255,255,.22); margin:0 auto; }

a { color:inherit; text-decoration:none; }
.tappable { transition:opacity .2s; cursor:pointer; }
.tappable:hover { opacity:.7; }

.confirm-wrap {
  margin-top:32px;
  padding-bottom:8px;
  animation:rise 1.1s ease .46s both;
}
.confirm {
  font-size:x-large;
  font-style:italic;
  font-weight:700;
  letter-spacing:2.5px;
  color:rgba(255,255,255,.88);
  border-bottom:1.5px solid rgba(255,255,255,.4);
  padding-bottom:3px;
  transition:color .2s, border-color .2s;
}
.confirm:hover { color:#fff; border-color:rgba(255,255,255,.7); }
</style>
